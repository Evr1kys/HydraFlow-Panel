services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydraflow
      POSTGRES_USER: hydraflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydraflow -d hydraflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://hydraflow:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/hydraflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in .env}
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be set in .env}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      NODE_AGENT_CA_CERT_PATH: ${NODE_AGENT_CA_CERT_PATH:-}
      NODE_CLIENT_CERT_PATH: ${NODE_CLIENT_CERT_PATH:-}
      NODE_CLIENT_KEY_PATH: ${NODE_CLIENT_KEY_PATH:-}
      NODE_AGENT_PRIVATE_ALLOWLIST: ${NODE_AGENT_PRIVATE_ALLOWLIST:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-}
      BOT_SHOP_ENABLED: ${BOT_SHOP_ENABLED:-false}
      BOT_SHOP_MODE: ${BOT_SHOP_MODE:-standalone}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
    volumes:
      - backupdata:/var/backups/hydraflow
      - ${NODE_TLS_SECRETS_DIR:-./secrets}:/run/secrets/hydraflow:ro
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:2080:80"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  backupdata:
