name: Upgrade secure dependencies

on:
  push:
    branches:
      - fix/panel-secure-dependencies

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/panel-secure-dependencies
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Upgrade backend production dependencies
        working-directory: backend
        run: |
          npm install --save-exact \
            @nestjs/common@12.0.3 \
            @nestjs/config@12.0.0 \
            @nestjs/core@12.0.3 \
            @nestjs/event-emitter@12.0.1 \
            @nestjs/jwt@12.0.2 \
            @nestjs/passport@12.0.0 \
            @nestjs/platform-express@12.0.3 \
            @nestjs/schedule@12.0.2 \
            @nestjs/swagger@12.0.1 \
            @nestjs/throttler@6.7.0 \
            @simplewebauthn/server@14.0.2 \
            bcrypt@6.0.0 \
            bullmq@5 \
            class-validator@0.15.1 \
            nanoid@3 \
            nodemailer@10.0.10 \
            uuid@11
          npm install --save-dev --save-exact \
            @nestjs/cli@12 \
            @nestjs/schematics@12 \
            @types/node@22
      - name: Commit generated manifests and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package.json backend/package-lock.json
          git commit -m 'build: upgrade vulnerable backend dependencies'
          git push origin HEAD:fix/panel-secure-dependencies
