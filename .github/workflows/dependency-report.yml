name: Dependency Report

on:
  push:
    branches:
      - feat/agent-client-v1

permissions:
  contents: read

jobs:
  report:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Query current package metadata
        run: |
          npm install --global npm@10.9.2
          for pkg in \
            @nestjs/common @nestjs/core @nestjs/platform-express \
            @nestjs/config @nestjs/event-emitter @nestjs/jwt @nestjs/passport \
            @nestjs/schedule @nestjs/swagger @nestjs/throttler \
            @simplewebauthn/server bcrypt bullmq nanoid nanoid@3 nodemailer uuid \
            class-transformer class-validator passport passport-jwt; do
            echo "=== $pkg ==="
            npm view "$pkg" version engines peerDependencies --json
          done
