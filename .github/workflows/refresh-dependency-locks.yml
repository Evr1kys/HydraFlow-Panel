name: Refresh Dependency Locks

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.head_ref == 'feat/agent-client-v1' && !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/agent-client-v1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate clean installs and production audit
        run: |
          npm ci --ignore-scripts --prefix backend
          npm audit --omit=dev --audit-level=high --prefix backend
          npm ci --ignore-scripts --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Commit lockfiles
        run: |
          if git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            echo "Lockfiles already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json frontend/package-lock.json
          git commit -m "build: refresh dependency lockfiles [lock-refresh]"
          git push origin HEAD:feat/agent-client-v1
