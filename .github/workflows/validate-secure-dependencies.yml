name: Validate secure dependencies

on:
  push:
    branches:
      - fix/panel-secure-dependencies

permissions:
  contents: read

concurrency:
  group: secure-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydraflow_test
          POSTGRES_USER: hydraflow
          POSTGRES_PASSWORD: ci-database-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hydraflow -d hydraflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hydraflow:ci-database-password@127.0.0.1:5432/hydraflow_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credential-key-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password-123456789
      CORS_ORIGIN: https://panel.example.test
      PUBLIC_BASE_URL: https://panel.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - run: npx prisma validate
        working-directory: backend
      - run: npx prisma migrate deploy
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-only-database-password-123456789
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credential-key-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password-123456789
      CORS_ORIGIN: https://panel.example.test
      PUBLIC_BASE_URL: https://panel.example.test
      NODE_TLS_SECRETS_DIR: ./secrets
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p secrets
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d postgres redis backend
      - name: Smoke test backend
        run: |
          for attempt in $(seq 1 40); do
            if docker compose exec -T backend node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color backend postgres redis
          exit 1
      - if: always()
        run: docker compose down -v --remove-orphans
