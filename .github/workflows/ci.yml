name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydraflow_test
          POSTGRES_USER: hydraflow
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hydraflow -d hydraflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hydraflow:ci-database-password@127.0.0.1:5432/hydraflow_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credential-key-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password-123456789
      CORS_ORIGIN: https://panel.example.test
      PUBLIC_BASE_URL: https://panel.example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate
      - name: Apply migrations to clean PostgreSQL
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Verify PostgreSQL and Redis connectivity
        working-directory: backend
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const Redis = require('ioredis');
          (async () => {
            const prisma = new PrismaClient();
            const redis = new Redis(process.env.REDIS_URL, { maxRetriesPerRequest: 1 });
            try {
              await prisma.$queryRawUnsafe('SELECT 1');
              if (await redis.ping() !== 'PONG') throw new Error('Redis PING failed');
            } finally {
              await prisma.$disconnect();
              redis.disconnect();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Test
        working-directory: backend
        run: npm test -- --runInBand
      - name: Production dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DB_PASSWORD: ci-only-database-password-123456789
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credential-key-0123456789abcdef0123456789abcdef
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password-123456789
      CORS_ORIGIN: https://panel.example.test
      PUBLIC_BASE_URL: https://panel.example.test
      NODE_TLS_SECRETS_DIR: ./secrets
    steps:
      - uses: actions/checkout@v7
      - name: Prepare non-secret mount directory
        run: mkdir -p secrets
      - name: Validate compose configuration
        run: docker compose config --quiet
      - name: Build containers
        run: docker compose build
      - name: Start production containers
        run: docker compose up -d postgres redis backend
      - name: Backend container smoke test
        run: |
          for attempt in $(seq 1 40); do
            if docker compose exec -T backend node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color backend postgres redis
          exit 1
      - name: Shutdown containers
        if: always()
        run: docker compose down -v --remove-orphans
