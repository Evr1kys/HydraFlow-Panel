name: Bootstrap Agent Client Branch

on:
  push:
    branches: [feat/agent-client-v1]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[agent-client-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/agent-client-v1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Update lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Add Agent fields to Prisma schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/prisma/schema.prisma')
          text = path.read_text()
          old = '''model Node {
            id             String          @id @default(uuid())
            name           String
            address        String
            port           Int
            apiKey         String          @default("")
            enabled        Boolean         @default(true)
            status         String          @default("unknown")
            lastCheck      DateTime?
            createdAt      DateTime        @default(now())
            billingNodes   BillingNode[]
            plugins        NodePlugin[]
            activeSessions ActiveSession[]
            metadata       NodeMeta[]
            hostLinks      HostsToNodes[]
          }
          '''
          new = '''model Node {
            id                String           @id @default(uuid())
            name              String
            address           String
            port              Int
            apiKey            String           @default("") // deprecated plaintext migration source
            agentKeyId        String           @default("")
            agentSecretEnc    String           @default("")
            agentCaCert       String?
            agentServerName   String?
            agentApiVersion   String?
            agentVersion      String?
            enabled           Boolean          @default(true)
            status            String           @default("unknown")
            lastCheck         DateTime?
            lastRevision      String?
            lastSyncAt        DateTime?
            lastSyncError     String?
            createdAt         DateTime         @default(now())
            billingNodes      BillingNode[]
            plugins           NodePlugin[]
            activeSessions    ActiveSession[]
            metadata          NodeMeta[]
            hostLinks         HostsToNodes[]
            deployments       NodeDeployment[]

            @@index([enabled, status])
          }

          model NodeDeployment {
            id             String    @id @default(uuid())
            nodeId         String
            node           Node      @relation(fields: [nodeId], references: [id], onDelete: Cascade)
            idempotencyKey String    @unique
            configHash     String
            revision       String?
            status         String    @default("pending")
            error          String?
            initiatedBy    String?
            createdAt      DateTime  @default(now())
            finishedAt     DateTime?

            @@index([nodeId, createdAt])
            @@index([status, createdAt])
          }
          '''
          if 'model NodeDeployment {' in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected Node model not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json backend/prisma/schema.prisma
          git commit -m "build: generate Agent client schema and lockfile [agent-client-bootstrap]"
          git push origin HEAD:feat/agent-client-v1
