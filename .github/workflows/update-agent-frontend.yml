name: Update Agent Frontend

on:
  push:
    branches: [feat/agent-client-v1]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[frontend-agent-form]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/agent-client-v1
      - name: Update node types and registration form
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          types_path = Path('frontend/src/types/index.ts')
          types = types_path.read_text()
          types = re.sub(
              r"export interface Node \{.*?\n\}\n\nexport interface Webhook",
              '''export interface Node {
            id: string;
            name: string;
            address: string;
            port: number;
            enabled: boolean;
            status: string;
            lastCheck: string | null;
            createdAt: string;
            agentKeyId: string;
            agentApiVersion: string | null;
            agentVersion: string | null;
            lastRevision: string | null;
            lastSyncAt: string | null;
            lastSyncError: string | null;
            credentialsConfigured: boolean;
            customCaConfigured: boolean;
            caFingerprint: string | null;
          }

          export interface Webhook''',
              types,
              flags=re.S,
          )
          types_path.write_text(types)

          page_path = Path('frontend/src/pages/Nodes.tsx')
          page = page_path.read_text()
          page = page.replace(
              '  TextInput,\n  NumberInput,',
              '  TextInput,\n  PasswordInput,\n  Textarea,\n  NumberInput,',
          )
          page = page.replace(
              '''interface CreateNodeFormValues {
            name: string;
            address: string;
            port: number | '';
            apiKey: string;
          }''',
              '''interface CreateNodeFormValues {
            name: string;
            address: string;
            port: number | '';
            keyId: string;
            apiKey: string;
            caCertificate: string;
            serverName: string;
          }''',
          )
          page = page.replace(
              "type NodeStatusFilter = 'all' | 'healthy' | 'error' | 'unknown';",
              "type NodeStatusFilter = 'all' | 'healthy' | 'degraded' | 'offline' | 'error' | 'unknown';",
          )
          page = page.replace(
              "{ name: '', address: '', port: 443, apiKey: '' },",
              "{ name: '', address: '', port: 8443, keyId: '', apiKey: '', caCertificate: '', serverName: '' },",
          )
          page = page.replace(
              '''      port: validators.combine(
                validators.isNotEmpty(t('validation.required')),
                validators.isPort(t('validation.port')),
              ),
            },''',
              '''      port: validators.combine(
                validators.isNotEmpty(t('validation.required')),
                validators.isPort(t('validation.port')),
              ),
              keyId: validators.isNotEmpty(t('validation.required')),
              apiKey: validators.isNotEmpty(t('validation.required')),
            },''',
          )
          page = page.replace(
              'const { name, address, port, apiKey } = nodeForm.values;',
              'const { name, address, port, keyId, apiKey, caCertificate, serverName } = nodeForm.values;',
          )
          page = page.replace(
              '''        port: Number(port) || 443,
                apiKey: apiKey || undefined,''',
              '''        port: Number(port) || 8443,
                keyId,
                apiKey,
                caCertificate: caCertificate || undefined,
                serverName: serverName || undefined,''',
          )
          page = page.replace(
              'nodeForm.reset({ port: 443 });',
              'nodeForm.reset({ port: 8443 });',
          )
          page = page.replace(
              'placeholder="192.168.1.100"',
              'placeholder="node-01.example.com"',
          )
          page = page.replace(
              '''            label={t('nodes.apiKey')}
                placeholder={t('nodes.optional')}
                value={nodeForm.values.apiKey}
                onChange={(e) =>
                  nodeForm.setFieldValue('apiKey', e.currentTarget.value)
                }
                styles={inputStyles}
              />''',
              '''            label="Agent key ID"
                placeholder="agent-0123456789abcdef"
                value={nodeForm.values.keyId}
                onChange={(e) =>
                  nodeForm.setFieldValue('keyId', e.currentTarget.value)
                }
                onBlur={() => nodeForm.setFieldTouched('keyId', true)}
                error={nodeForm.getInputProps('keyId').error}
                styles={inputStyles}
              />
              <PasswordInput
                label="Agent registration secret"
                description="Shown once by hydraflow-agent init"
                value={nodeForm.values.apiKey}
                onChange={(e) =>
                  nodeForm.setFieldValue('apiKey', e.currentTarget.value)
                }
                onBlur={() => nodeForm.setFieldTouched('apiKey', true)}
                error={nodeForm.getInputProps('apiKey').error}
                styles={inputStyles}
              />
              <Textarea
                label="Agent CA certificate"
                description="PEM CA from hydraflow-agent init; optional for publicly trusted certificates"
                placeholder="-----BEGIN CERTIFICATE-----"
                autosize
                minRows={4}
                maxRows={8}
                value={nodeForm.values.caCertificate}
                onChange={(e) =>
                  nodeForm.setFieldValue('caCertificate', e.currentTarget.value)
                }
                styles={inputStyles}
              />
              <TextInput
                label="TLS server name"
                description="Optional explicit certificate name"
                placeholder="node-01.example.com"
                value={nodeForm.values.serverName}
                onChange={(e) =>
                  nodeForm.setFieldValue('serverName', e.currentTarget.value)
                }
                styles={inputStyles}
              />''',
          )
          page = page.replace(
              '''            <Chip value="error" color="red" radius="md" size="sm">
                      Error
                    </Chip>''',
              '''            <Chip value="degraded" color="yellow" radius="md" size="sm">
                      Degraded
                    </Chip>
                    <Chip value="offline" color="orange" radius="md" size="sm">
                      Offline
                    </Chip>
                    <Chip value="error" color="red" radius="md" size="sm">
                      Error
                    </Chip>''',
          )
          page_path.write_text(page)
          PY
      - name: Commit frontend update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/types/index.ts frontend/src/pages/Nodes.tsx
          git commit -m "feat(frontend): register authenticated Agents [frontend-agent-form]"
          git push origin HEAD:feat/agent-client-v1
